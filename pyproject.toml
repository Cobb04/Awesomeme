[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-l1-adapter"
version = "0.4.0"
description = "WeChat, WeCom and Feishu source adapters for Awesomeme"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "qrcode>=8,<9", "Pillow>=12.1,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
feishu-export = "feishu_adapter.__main__:main"

[project.urls]
Repository = "https://github.com/Cobb04/Awesomeme"

[tool.setuptools.packages.find]
include = ["feishu_adapter*", "wecom_adapter*", "wechat_adapter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py310"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "I"]

[tool.setuptools.package-data]
wechat_adapter = ["UPSTREAM.json"]
